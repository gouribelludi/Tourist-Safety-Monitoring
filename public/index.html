<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Route + Police & Medical Along Route (Leaflet + OSRM + Overpass)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    body { margin:0; font-family: Arial, Helvetica, sans-serif; }
    #map { position: absolute; top:120px; bottom:0; right:0; left:0; }
    .controls {
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      background: white;
      padding: 10px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      z-index: 1000;
    }
    input[type=text] { width: calc(50% - 12px); padding:6px; margin-right:8px; }
    button { padding:6px 10px; }
    label { font-size: 13px; display:block; margin-bottom:6px; }
    .small { font-size:12px; color:#555; }
  </style>
</head>
<body>
  <div class="controls">
    <label>
      Origin (lat,lng or address) — leave empty to use browser location
      <input id="origin" type="text" placeholder="e.g. 40.7486,-73.9864 or 1600 Amphitheatre Parkway" />
    </label>
    <label>
      Destination (lat,lng or address)
      <input id="destination" type="text" placeholder="e.g. 40.7614,-73.9776 or Empire State Building" />
    </label>
    <div style="margin-top:6px;">
      <button id="go">Show route & police/medical</button>
      <button id="clear">Clear</button>
      <span style="margin-left:12px" class="small">Distance buffer (meters): <input id="buffer" type="number" value="500" style="width:80px"/></span>
    </div>
    <div id="status" class="small" style="margin-top:8px;color:#333"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
