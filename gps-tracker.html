<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker - Tourist Safety</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 24px;
        }

        .back-btn {
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .tracker-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }

        .btn-stop:hover {
            box-shadow: 0 10px 20px rgba(220, 53, 69, 0.3);
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .status-box.active {
            background: #d4edda;
            border-left-color: #28a745;
        }

        .status-box h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .status-box p {
            color: #666;
            font-size: 14px;
            margin: 5px 0;
        }

        .location-info {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 6px;
            margin-top: 10px;
            font-size: 13px;
            color: #004085;
        }

        .btn-location {
            width: 100%;
            padding: 12px;
            background: #17a2b8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .btn-location:hover {
            background: #138496;
            transform: translateY(-2px);
        }
        .alert-box {
            margin-top: 20px;
            padding: 15px;
            background: #fdecea;
            border-left: 4px solid #dc3545;
            border-radius: 8px;
            color: #842029;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📍 GPS Tracker</h1>
            <a href="dashboard.html" class="back-btn">← Back to Dashboard</a>
        </div>

        <div class="tracker-card">
            <button class="btn-location" onclick="getCurrentLocation()">📍 Get My Current Location</button>

            <form id="trackerForm">
                <div class="form-group">
                    <label for="name">Your Name *</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" name="destination" placeholder="Where are you going?">
                </div>

                <div class="form-group">
                    <label for="travelDate">Travel Date *</label>
                    <input type="date" id="travelDate" name="travelDate" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>

                <button type="submit" class="btn-primary" id="startBtn">Start Tracking</button>
                <button type="button" class="btn-primary btn-stop" id="stopBtn" style="display:none;" onclick="stopTracking()">Stop Tracking</button>
            </form>

            <div class="status-box" id="statusBox">
                <h3>Status</h3>
                <p id="statusText">Not tracking yet. Fill in your details and click "Start Tracking".</p>
                <div id="locationInfo" class="location-info" style="display:none;"></div>
            </div>
            <div class="status-box" id="weatherBox" style="margin-top:20px;">
                <h3>Destination Weather</h3>
                <p id="weatherStatus">Enter destination and date to load forecast.</p>
                <div id="weatherInfo" style="display:none; background:#fff; padding:10px; border-radius:6px; margin-top:10px; font-size:13px; line-height:1.4;"></div>
            </div>
            <div class="alert-box" id="alertBox" style="display:none;">
                <strong>⚠️ Weather Alert:</strong>
                <div id="alertText" style="margin-top:6px;"></div>
            </div>
            
        </div>
    </div>

    <script>
        // Check login
        if (!localStorage.getItem('isLoggedIn')) {
            window.location.href = 'index.html';
        }

        let trackingInterval = null;
        let watchId = null;
        let trackingActive = false;
        // Prefill if already active
        window.addEventListener('load', async () => {
            try {
                const res = await fetch('/api/track/me');
                const data = await res.json();
                if (data.active) {
                    const u = data.user;
                    document.getElementById('name').value = u.name || '';
                    document.getElementById('phone').value = u.phone || '';
                    document.getElementById('destination').value = u.destination || '';
                    document.getElementById('email').value = u.email || '';
                    trackingActive = true;
                    document.getElementById('startBtn').style.display = 'none';
                    document.getElementById('stopBtn').style.display = 'block';
                    document.getElementById('statusBox').classList.add('active');
                    document.getElementById('statusText').innerHTML = `<strong>✅ Tracking Active (Resumed)</strong><br>Name: ${u.name || 'N/A'}<br>Phone: ${u.phone || 'N/A'}<br>${u.destination ? 'Destination: '+u.destination+'<br>' : ''}`;
                    if (data.latestPosition) {
                        const p = data.latestPosition;
                        document.getElementById('locationInfo').style.display = 'block';
                        document.getElementById('locationInfo').innerHTML = `<strong>📍 Last Known:</strong><br>Latitude: ${p.latitude.toFixed(6)}<br>Longitude: ${p.longitude.toFixed(6)}<br>Accuracy: ±${p.accuracy ? p.accuracy.toFixed(0) : 'N/A'} meters`;
                    }
                    // Re-start position watch so live updates continue
                    watchId = navigator.geolocation.watchPosition(sendWatchUpdate, console.error, { enableHighAccuracy:true, maximumAge:0, timeout:5000 });
                }
            } catch(e) { console.warn('Prefill tracking failed', e); }
        });

        function sendWatchUpdate(position) {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            const accuracy = position.coords.accuracy.toFixed(0);
            const timestamp = new Date().toLocaleTimeString();
            document.getElementById('locationInfo').style.display = 'block';
            document.getElementById('locationInfo').innerHTML = `
                <strong>📍 Live Location (Updated: ${timestamp}):</strong><br>
                Latitude: ${lat}<br>
                Longitude: ${lng}<br>
                Accuracy: ±${accuracy} meters<br>
                Speed: ${position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) + ' km/h' : 'N/A'}
            `;
            sendPosition(position);
        }

        async function startTrackingOnServer(initialPosition) {
            const payload = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                destination: document.getElementById('destination').value,
                email: document.getElementById('email').value,
                latitude: initialPosition?.coords?.latitude,
                longitude: initialPosition?.coords?.longitude,
                accuracy: initialPosition?.coords?.accuracy
            };
            try {
                const res = await fetch('/api/track/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!data.success) {
                    console.warn('Failed to register tracking');
                } else {
                    trackingActive = true;
                }
            } catch (e) {
                console.error('Start tracking error', e);
            }
        }

        async function sendPosition(position) {
            if (!trackingActive) return; // only after start
            try {
                await fetch('/api/track/position', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        accuracy: position.coords.accuracy
                    })
                });
            } catch (e) {
                console.error('Position update error', e);
            }
        }

        function getCurrentLocation() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }

            document.getElementById('statusText').innerHTML = 'Getting your location...';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lng = position.coords.longitude.toFixed(6);
                    const accuracy = position.coords.accuracy.toFixed(0);
                    
                    document.getElementById('locationInfo').style.display = 'block';
                    document.getElementById('locationInfo').innerHTML = `
                        <strong>📍 Current Location Detected:</strong><br>
                        Latitude: ${lat}<br>
                        Longitude: ${lng}<br>
                        Accuracy: ±${accuracy} meters
                    `;
                    
                    document.getElementById('statusText').innerHTML = 'Location detected! Ready to start tracking.';
                },
                (error) => {
                    alert('Unable to get your location: ' + error.message);
                    document.getElementById('statusText').innerHTML = 'Error getting location. Please try again.';
                }
            );
        }

        document.getElementById('trackerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            if (!navigator.geolocation) {
                alert('Geolocation is not supported by your browser');
                return;
            }

            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const destination = document.getElementById('destination').value;
            const email = document.getElementById('email').value;

            // Start tracking
            document.getElementById('statusBox').classList.add('active');
            document.getElementById('statusText').innerHTML = `
                <strong>✅ Tracking Active</strong><br>
                Name: ${name}<br>
                Phone: ${phone}<br>
                ${destination ? 'Destination: ' + destination + '<br>' : ''}
                Tracking started at ${new Date().toLocaleTimeString()}
            `;

            // Hide start button, show stop button
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';

            // Acquire initial position then start server tracking and watch
            navigator.geolocation.getCurrentPosition(async (initialPos) => {
                await startTrackingOnServer(initialPos);
                // Watch position continuously
                watchId = navigator.geolocation.watchPosition(sendWatchUpdate, (error)=>console.error('Location error:', error), { enableHighAccuracy:true, maximumAge:0, timeout:5000 });
            }, (err) => {
                console.error('Initial position error', err);
            }, { enableHighAccuracy: true });
        });

        function stopTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            trackingActive = false;
            fetch('/api/track/stop', { method: 'POST' });

            document.getElementById('statusBox').classList.remove('active');
            document.getElementById('statusText').innerHTML = 'Tracking stopped at ' + new Date().toLocaleTimeString();
            document.getElementById('locationInfo').style.display = 'none';
            
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
        }

        // Auto-load current location on page load
        window.addEventListener('load', function() {
            setTimeout(getCurrentLocation, 500);
        });

        // -------- WEATHER FORECAST FEATURE --------
        async function geocodeDestination(text) {
            text = (text || '').trim();
            if (!text) return null;
            const latLngMatch = text.match(/^\s*([+-]?\d+(?:\.\d+)?)\s*,\s*([+-]?\d+(?:\.\d+)?)\s*$/);
            if (latLngMatch) {
                return { lat: parseFloat(latLngMatch[1]), lon: parseFloat(latLngMatch[2]), label: text };
            }
            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(text);
            const res = await fetch(url, { headers:{'Accept-Language':'en'} });
            if (!res.ok) throw new Error('Geocoding failed');
            const data = await res.json();
            if (!data.length) throw new Error('Place not found');
            return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), label: data[0].display_name };
        }

        async function fetchWeather(lat, lon, dateStr) {
            const base = 'https://api.open-meteo.com/v1/forecast';
            const params = new URLSearchParams({
                latitude: lat,
                longitude: lon,
                start_date: dateStr,
                end_date: dateStr,
                daily: 'temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,weather_code',
                timezone: 'auto'
            });
            const url = `${base}?${params.toString()}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error('Weather API error');
            return res.json();
        }

        async function updateWeather() {
            const dest = document.getElementById('destination').value;
            const date = document.getElementById('travelDate').value;
            const weatherStatus = document.getElementById('weatherStatus');
            const weatherInfo = document.getElementById('weatherInfo');
            const alertBox = document.getElementById('alertBox');
            const alertText = document.getElementById('alertText');
            if (!dest || !date) {
                weatherStatus.textContent = 'Enter destination and date to load forecast.';
                weatherInfo.style.display='none';
                alertBox.style.display='none';
                return;
            }
            const selected = new Date(date);
            const today = new Date(); today.setHours(0,0,0,0);
            const maxRange = new Date();
            maxRange.setDate(today.getDate()+16);
            if (selected < today || selected > maxRange) {
                weatherStatus.textContent = 'Select a date within the next 16 days for forecast.';
                weatherInfo.style.display='none';
                alertBox.style.display='none';
                return;
            }
            weatherStatus.textContent = 'Loading forecast...';
            try {
                const geo = await geocodeDestination(dest);
                const data = await fetchWeather(geo.lat, geo.lon, date);
                const d = data.daily;
                if (!d || !d.time || !d.time.length) {
                    weatherStatus.textContent = 'No forecast available.';
                    weatherInfo.style.display='none';
                    alertBox.style.display='none';
                    return;
                }
                const maxT = d.temperature_2m_max[0];
                const minT = d.temperature_2m_min[0];
                const rain = d.precipitation_sum[0];
                const wind = d.wind_speed_10m_max[0];
                const code = (d.weather_code && d.weather_code[0]) || null;
                weatherInfo.style.display='block';
                weatherInfo.innerHTML = `
                    <strong>${geo.label.split(',')[0]}</strong> (${date})<br>
                    🌡️ Max: ${maxT}°C | Min: ${minT}°C<br>
                    🌧️ Precipitation: ${rain} mm<br>
                    💨 Max Wind: ${wind} m/s<br>
                    Lat: ${geo.lat.toFixed(3)}, Lon: ${geo.lon.toFixed(3)}
                `;
                weatherStatus.textContent = 'Forecast loaded.';

                // Determine severe conditions
                const issues = [];
                if (rain >= 10) issues.push('Heavy rain');
                if (wind >= 14) issues.push('Strong wind'); // ~50 km/h
                if (maxT >= 40) issues.push('Extreme heat');
                if (minT <= 3) issues.push('Very low temperature');
                if (code !== null && (Number(code) >= 95 || Number(code) === 96 || Number(code) === 99)) {
                    issues.push('Thunderstorm risk');
                }

                if (issues.length) {
                    const msg = `${geo.label.split(',')[0]} on ${date}: ${issues.join(', ')}.`;
                    alertText.textContent = msg + ' Please take precautions or reconsider travel.';
                    alertBox.style.display = 'block';
                    // Browser notification
                    try {
                        if ('Notification' in window) {
                            if (Notification.permission === 'granted') {
                                new Notification('Weather Alert', { body: msg });
                            } else if (Notification.permission !== 'denied') {
                                const p = await Notification.requestPermission();
                                if (p === 'granted') new Notification('Weather Alert', { body: msg });
                            }
                        }
                    } catch {}
                } else {
                    alertBox.style.display='none';
                }
            } catch(e) {
                weatherStatus.textContent = 'Weather lookup failed: ' + e.message;
                weatherInfo.style.display='none';
                alertBox.style.display='none';
            }
        }

        document.getElementById('destination').addEventListener('change', updateWeather);
        document.getElementById('travelDate').addEventListener('change', updateWeather);
    </script>
</body>
</html>
