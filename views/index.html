<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:40px;}
    h1{margin-bottom:12px;font-size:22px;}
    form{max-width:320px;padding:16px;border:1px solid #ccc;border-radius:8px;background:#fafafa;}
    label{display:block;margin:10px 0 4px;font-size:13px;font-weight:600;}
    input{width:100%;padding:8px 10px;border:1px solid #bbb;border-radius:4px;font-size:14px;}
    button{margin-top:14px;width:100%;padding:10px;border:none;background:#667eea;color:#fff;font-weight:600;border-radius:4px;cursor:pointer;}
    button:active{opacity:.85}
    #msg{margin-top:10px;font-size:12px;color:#c00;min-height:16px;}
    .hint{font-size:12px;color:#555;margin-top:14px;}
  </style>
</head>
<body>
  <h1>Simple Login</h1>
  <form id="loginForm">
    <label for="username">Username</label>
    <input id="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" required>
    <button type="submit">Login</button>
    <div id="msg"></div>
    <div class="hint">Fallback mode: any non-empty credentials work. Demo: tourist / safe123</div>
  </form>
  <script>
    async function doLogin(u,p){
      const r = await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
      const j = await r.json();
      if(!j.success) throw new Error(j.message||'Login failed');
      return j;
    }
    const form=document.getElementById('loginForm');
    const msg=document.getElementById('msg');
    form.addEventListener('submit',async e=>{
      e.preventDefault(); msg.textContent='';
      const u=username.value.trim(); const p=password.value;
      if(!u||!p){ msg.textContent='Enter both fields.'; return; }
      try{
        await doLogin(u,p);
        // Main app session marker
        localStorage.setItem('isLoggedIn','true');
        localStorage.setItem('username',u);
        // Provide tourist-safety suite required fields if absent
        if(!localStorage.getItem('userId')){
          localStorage.setItem('userId','u-' + Date.now());
        }
        if(!localStorage.getItem('email')){
          localStorage.setItem('email',u + '@demo.local');
        }
        window.location.href='/dashboard';
      } catch(err){ msg.textContent=err.message; }
    });
  </script>
</body>
</html>
