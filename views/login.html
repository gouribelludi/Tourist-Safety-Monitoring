<!doctype html>
<html>
<head>
  <title>Login</title>
  <meta charset="UTF-8" />
  <style>
    body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f5f7fa; }
    .card { background:#fff; padding:30px 35px; border-radius:12px; box-shadow:0 8px 25px rgba(0,0,0,0.15); width:340px; }
    h2 { margin:0 0 20px; color:#334; text-align:center; }
    input { width:100%; padding:12px 14px; margin:8px 0; border:2px solid #e0e4e8; border-radius:8px; font-size:14px; }
    input:focus { outline:none; border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,.15); }
    button { width:100%; padding:14px; margin-top:10px; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; }
    button:hover { filter:brightness(1.08); }
    .msg { margin-top:12px; font-size:13px; color:#555; text-align:center; min-height:18px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Tourist Safety Login</h2>
    <form id="loginForm">
      <input name="username" id="username" placeholder="Username" required>
      <input name="password" id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const msg = document.getElementById('msg');
      msg.textContent = 'Authenticating...';
      try {
        const res = await fetch('/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('isLoggedIn','true');
          localStorage.setItem('username', username);
          msg.textContent = 'Login successful. Redirecting...';
          setTimeout(()=> { window.location.href = '/gps-tracker.html'; }, 500);
        } else {
          msg.textContent = 'Invalid credentials.';
        }
      } catch (err) {
        msg.textContent = 'Server error.';
      }
    });
  </script>
</body>
</html>
