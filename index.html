<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tourist Safety - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .info-text {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            font-size: 13px;
            color: #555;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="icon-wrapper">🛡️</div>
            <h1>Tourist Safety System</h1>
            <p>Your safety companion for travel</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

                        <button type="submit" class="btn-login">Login</button>
                        <div style="margin-top:14px; text-align:center; font-size:13px;">
                            <a href="#" id="registerLink" style="color:#667eea; text-decoration:underline;">Need an account? Register</a>
                        </div>
        </form>

        <div class="info-text">
            <strong>Demo Credentials:</strong><br>
            Username: <code>tourist</code> | Password: <code>safe123</code>
        </div>
    </div>

    <script>
                async function postJSON(url, data){
                    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)});
                    const j = await r.json();
                    if (!r.ok || !j.success) throw new Error(j.message || 'Request failed');
                    return j;
                }

                document.getElementById('loginForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    if (!username || !password) return;
                    btn.disabled = true; btn.textContent='Logging in...';
                    try {
                        await postJSON('/login', { username, password });
                        localStorage.setItem('isLoggedIn','true');
                        localStorage.setItem('username', username);
                        window.location.href='dashboard.html';
                    } catch (err) {
                        alert('Login failed: ' + err.message);
                    } finally {
                        btn.disabled=false; btn.textContent='Login';
                    }
                });

                document.getElementById('registerLink').addEventListener('click', async (e) => {
                    e.preventDefault();
                    const username = usernameInput.value.trim();
                    const password = passwordInput.value;
                    if (!username || !password) { alert('Enter username & password first'); return; }
                    try {
                        await postJSON('/register', { username, password });
                        alert('Registered. You can now login.');
                    } catch (err) {
                        alert('Registration failed: ' + err.message);
                    }
                });

                // Cache DOM refs
                const usernameInput = document.getElementById('username');
                const passwordInput = document.getElementById('password');
                const btn = document.querySelector('.btn-login');
    </script>
</body>
</html>
